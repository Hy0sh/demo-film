<!doctype html>
<html><head><meta charset="utf-8"><title>Demo shop</title>
<style>body{font:16px sans-serif;margin:20px} dialog,[role=dialog]{border:1px solid #888;padding:16px;background:#fff;margin:8px}</style></head>
<body>
<nav>
  <button id="parent" onclick="document.getElementById('sub').hidden=!document.getElementById('sub').hidden">Settings</button>
  <ul id="sub" hidden><li><a href="#profile" onclick="show('Profile page')">Profile</a></li></ul>
  <a href="#decoy" onclick="show('Decoy page')">Profile settings</a>
</nav>
<h1>Home</h1>
<p id="state"></p>
<label>Name <input id="name"></label>
<input placeholder="Search" onkeydown="if(event.key==='Enter')show('Submitted: '+this.value)">
<label>Secret <input type="password"></label>
<label>Start <input type="date" onchange="document.getElementById('picked').textContent='Picked '+this.value"></label>
<label>Tint <input type="color"></label>
<!-- French typography: a narrow no-break space before the colon. -->
<input placeholder="ex&#8239;: Natation" oninput="show('Sport: ' + this.value)">
<button onclick="show('Group saved')">Enregistrer&nbsp;le&nbsp;groupe</button>
<!-- Its options arrive a second after New address, as from an API. -->
<button onclick="loadCities()">New address</button>
<label>City <select id="city" onchange="show('City: ' + this.value)"><option>Loading…</option></select></label>
<p>
  <button onclick="setTimeout(() => document.getElementById('pay').disabled = false, 1500)">Load the list</button>
  <button id="pay" disabled onclick="show('Paid')">Pay</button>
</p>
<p>
  <button onclick="toast()">Create a group</button>
  <span style="position: relative; display: inline-block">
    <button onclick="show('Logged out')">Log out</button>
    <span id="toasts"></span>
  </span>
</p>
<p id="picked"></p>
<label>Locked <input type="date" oninput="this.value = ''"></label>
<p>Month: <span id="month"></span></p>
<table>
  <tr><td>Ada</td><td><button onclick="show('Editing Ada')">&#9998;</button><button onclick="show('Removed Ada')">&#128465;</button></td></tr>
  <tr><td>Grace</td><td><button aria-label="Edit" onclick="show('Editing Grace')">&#9998;</button></td></tr>
</table>
<span id="help" onmouseenter="show('Help tooltip')">Help</span>
<p>
  <button onclick="show('Monday booked')">11h30 – 13h30</button>
  <button onclick="show('Tuesday booked')">11h30 – 13h30</button>
  <button onclick="show('Wednesday booked')">11h30 – 13h30</button>
</p>
<p>
  <button aria-label="Actions" onclick="show('Board actions')">&#8942;</button>
  <button aria-label="Actions" onclick="show('Card one actions')">&#8942;</button>
  <button aria-label="Actions" onclick="show('Card two actions')">&#8942;</button>
</p>
<button onclick="openWizard()">Open wizard</button>
<button onclick="setTimeout(() => show('Export done'), slowJob)">Start export</button>
<a href="/docs" target="_blank">Docs</a>
<div id="slot"></div>
<script>
const show = t => { document.getElementById('state').textContent = t; };
document.getElementById('month').textContent = new Date(2026, 9, 6).toLocaleDateString(undefined, { month: 'long' });
function loadCities() {
  const city = document.getElementById('city');
  city.innerHTML = '<option>Loading…</option>';
  setTimeout(() => city.innerHTML = '<option>Paris</option><option>Lyon</option>', 1000);
}
const slowJob = 12000; // ms, a task long enough for a cut to matter
// A toast over the Log out button, gone after 1.5 s; like real toast
// libraries, it pauses while the mouse is over it.
function toast() {
  const t = document.createElement('span');
  t.textContent = 'Group created.';
  t.style.cssText = 'position: absolute; inset: -6px -40px; background: #333; color: #fff; padding: 4px';
  let timer;
  const arm = () => { timer = setTimeout(() => t.remove(), 1500); };
  t.onmouseenter = () => clearTimeout(timer);
  t.onmouseleave = arm;
  document.getElementById('toasts').appendChild(t);
  arm();
}
function openWizard() {
  const d = document.createElement('div'); d.setAttribute('role', 'dialog');
  d.innerHTML = '<h2>Wizard</h2><label>Colour <select><option>Red</option><option>Blue</option></select></label>' +
    '<p id="wiz">Pick a colour</p><button id="next">Next</button><button id="close">Close</button>';
  document.getElementById('slot').appendChild(d);
  d.querySelector('#next').onclick = () => { d.querySelector('#wiz').textContent = 'Step two: ' + d.querySelector('select').value; };
  d.querySelector('#close').onclick = () => {
    const c = document.createElement('div'); c.setAttribute('role', 'dialog');
    c.innerHTML = '<p>Abandon changes?</p><button>Keep</button><button>Discard</button>';
    document.getElementById('slot').appendChild(c);
    c.querySelectorAll('button')[1].onclick = () => { document.getElementById('slot').innerHTML = ''; show('Wizard closed'); };
  };
}
</script>
</body></html>

<!doctype html>
<meta charset="utf-8">
<!-- The title card join puts before a film: its title, centred on the
     caption band's colours, over the whole frame. -->
<body style="margin: 0; height: {{.Height}}px; box-sizing: border-box; padding: 0 80px;
             display: flex; align-items: center; justify-content: center; text-align: center;
             background: {{.Background}}; border-top: 4px solid {{.Accent}};
             color: #fff; font: 700 44px/1.3 system-ui, sans-serif">
  {{.Title}}
</body>
